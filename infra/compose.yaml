name: dorm-trading
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: dorm_trading
      POSTGRES_USER: dorm_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm_app -d dorm_trading"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
