name: dorm-trading-demo

services:
  # ============================================================================
  # 1. PostgreSQL 16 (nội bộ Docker network — tránh đụng cổng 5432 trên máy demo)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dorm_trading}
      POSTGRES_USER: ${POSTGRES_USER:-dorm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorm_password}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dorm-demo-network

  # ============================================================================
  # 2. Maildev (Web UI xem OTP tại http://localhost:1080, SMTP nội bộ :1025)
  # ============================================================================
  maildev:
    image: maildev/maildev:2.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILDEV_WEB_PORT:-1080}:1080"
      - "127.0.0.1:${MAILDEV_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:1080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - dorm-demo-network

  # ============================================================================
  # 3. MinIO Object Storage (S3 API :9000, Web Console :9001)
  # ============================================================================
  minio:
    image: ghcr.io/coollabsio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dorm_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dorm_minio_password123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - dorm-demo-network

  # ============================================================================
  # 4. Backend Spring Boot 3.5 / JDK 21 (chỉ phục vụ qua Nginx reverse-proxy)
  # ============================================================================
  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/dorm-trading-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: "8082"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (Base64 >= 32 bytes) in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dorm_trading}
      POSTGRES_USER: ${POSTGRES_USER:-dorm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorm_password}
      SPRING_MAIL_HOST: maildev
      SPRING_MAIL_PORT: "1025"
      # Demo chạy MinIO: thiếu dòng này backend ghi ảnh vào ổ container và mất khi recreate.
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dorm_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dorm_minio_password123}
      S3_REGION: ${S3_REGION:-us-east-1}
      MEDIA_STORAGE_DIR: /app/data/uploads
    volumes:
      - backend_uploads:/app/data/uploads
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:$${SERVER_PORT:-8082}/api/v1/health\" | grep -q '\"database\":\"CONNECTED\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dorm-demo-network

  # ============================================================================
  # 5. Admin Web (React + Nginx SPA + Reverse Proxy /api/ -> backend:8082)
  # ============================================================================
  admin-web:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/dorm-trading-admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8080}:80"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dorm-demo-network

  # ============================================================================
  # 6. (Tùy chọn --profile auto-cd) Watchtower tự động pull bản mới mỗi 15 giây
  # ============================================================================
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    profiles:
      - auto-cd
    command: ["--interval", "15", "--cleanup", "--label-enable"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dorm-demo-network

networks:
  dorm-demo-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  backend_uploads:
