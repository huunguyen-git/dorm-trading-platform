name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace errors
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            echo "Initial commit; skipping whitespace diff check."
          fi

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          docker run --rm --read-only \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 -color

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x backend/mvnw

      - name: Build and verify backend with Maven
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  admin-web:
    name: admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    env:
      VITE_API_URL: http://localhost:8082/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci
      - name: Check TypeScript
        run: npm run lint
      - name: Test admin web
        run: npm test
      - name: Build admin web
        run: npm run build

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 'true'
      EXPO_PUBLIC_API_URL: http://localhost:8082/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci
      - name: Check TypeScript
        run: npm run lint
      - name: Test mobile
        run: npm test
      - name: Export Android bundle
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify demo env template leaves JWT_SECRET empty
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^JWT_SECRET=$' infra/demo/.env.demo.example

      - name: Validate demo Docker Compose configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ci-check
          JWT_SECRET: ci-validation-placeholder
        run: |
          set -euo pipefail
          tmp_env="$(mktemp)"
          trap 'rm -f "$tmp_env"' EXIT
          cp infra/demo/.env.demo.example "$tmp_env"
          sed -i 's/^DOCKERHUB_USERNAME=.*/DOCKERHUB_USERNAME=ci-check/' "$tmp_env"
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-validation-placeholder/' "$tmp_env"
          docker compose -f infra/demo/docker-compose.demo.yml --env-file "$tmp_env" config --quiet
          docker compose -f infra/demo/docker-compose.demo.yml --env-file "$tmp_env" --profile auto-cd config --quiet

      - name: Validate Admin Web Nginx configuration
        shell: bash
        run: |
          docker run --rm --read-only \
            --tmpfs /var/cache/nginx \
            --tmpfs /var/run \
            --tmpfs /tmp \
            --volume "$GITHUB_WORKSPACE/admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Build admin-web Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: admin-web
          file: admin-web/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=/api/v1
          cache-from: type=gha,scope=ci-admin-web
          cache-to: type=gha,mode=max,scope=ci-admin-web

  required:
    name: required
    runs-on: ubuntu-latest
    needs: [repository, workflow-lint, backend, admin-web, mobile, docker]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Evaluate mandatory CI checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys

          results = json.loads(os.environ.get('RESULTS', '{}'))
          failures = {job: data.get('result') for job, data in results.items()
                      if data.get('result') != 'success'}

          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a', encoding='utf-8') as f:
                  f.write("### Mandatory CI Status Gate Results\n\n")
                  f.write("| Job | Result | Status |\n")
                  f.write("| --- | --- | :---: |\n")
                  for job, data in results.items():
                      res = data.get('result', 'unknown')
                      badge = "✅ PASS" if res == 'success' else "❌ FAIL"
                      f.write(f"| `{job}` | `{res}` | {badge} |\n")

          if failures:
              print(f"Required checks failed: {failures}", file=sys.stderr)
              sys.exit(1)

          print(f"All {len(results)} required checks passed: {', '.join(results.keys())}")
          PY
