<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow3" x="-4%" y="-4%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" rx="16" fill="url(#bgGrad3)" />
  <rect x="1" y="1" width="998" height="678" rx="15" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    KIẾN TRÚC CI/CD PIPELINE ĐA NỀN TẢNG
  </text>
  <text x="500" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
    Quy trình Kiểm thử Song song, Cổng Kiểm duyệt Bắt buộc và Đóng gói Bản phát hành
  </text>

  <!-- STAGE 1: TRIGGERS -->
  <g transform="translate(40, 80)" filter="url(#shadow3)">
    <rect width="920" height="65" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="15" y="15" width="140" height="35" rx="6" fill="#3b82f6" />
    <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fff">
      1. TRIGGERS
    </text>

    <!-- Trigger Badges -->
    <rect x="180" y="18" width="220" height="30" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1" />
    <text x="290" y="38" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#93c5fd">
      pull_request: [main]
    </text>

    <rect x="420" y="18" width="220" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="530" y="38" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#6ee7b7">
      push: branches: [main]
    </text>

    <rect x="660" y="18" width="230" height="30" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1" />
    <text x="775" y="38" text-anchor="middle" font-family="system-ui, monospace" font-size="12" fill="#fbcfe8">
      release: tags: [v*.*.*]
    </text>
  </g>

  <!-- Arrow down -->
  <path d="M 500 145 L 500 170" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="500,175 495,165 505,165" fill="#38bdf8" />

  <!-- STAGE 2: PARALLEL CI JOBS -->
  <g transform="translate(40, 180)" filter="url(#shadow3)">
    <rect width="920" height="230" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <rect x="15" y="12" width="280" height="30" rx="6" fill="#1e3a8a" />
    <text x="155" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#bfdbfe">
      2. CI PARALLEL EXECUTION (Song song trên 5 Job)
    </text>

    <!-- Job 1: Repo Check -->
    <g transform="translate(20, 55)">
      <rect width="165" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="8" y="8" width="149" height="24" rx="4" fill="#334155" />
      <text x="82" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">repository</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• ubuntu-latest</text>
      <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• git diff --check</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Bắt trailing spaces</text>
      <text x="12" y="104" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Conflict markers</text>
      <rect x="10" y="125" width="145" height="20" rx="4" fill="#065f46" />
      <text x="82" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#a7f3d0">Repo Clean</text>
    </g>

    <!-- Job 2: Workflow Lint -->
    <g transform="translate(195, 55)">
      <rect width="165" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="8" y="8" width="149" height="24" rx="4" fill="#334155" />
      <text x="82" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">workflow-lint</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Docker actionlint</text>
      <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Read-only mode</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Lint toàn bộ YAML</text>
      <text x="12" y="104" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Bắt lỗi cú pháp GHA</text>
      <rect x="10" y="125" width="145" height="20" rx="4" fill="#065f46" />
      <text x="82" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#a7f3d0">YAML Valid</text>
    </g>

    <!-- Job 3: Backend (Hero) -->
    <g transform="translate(370, 55)">
      <rect width="180" height="155" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="8" y="8" width="164" height="24" rx="4" fill="#1d4ed8" />
      <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff">backend (Spring Boot)</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10.5" fill="#bfdbfe">• Temurin JDK 21 LTS</text>
      <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#bfdbfe">• Maven Cache (~15s)</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10.5" fill="#bfdbfe">• ./mvnw clean verify</text>
      <text x="12" y="104" font-family="system-ui, sans-serif" font-size="10.5" fill="#bfdbfe">• Surefire test reports</text>
      <rect x="10" y="125" width="160" height="20" rx="4" fill="#059669" />
      <text x="90" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#fff">Backend Tests Pass</text>
    </g>

    <!-- Job 4: Admin Web -->
    <g transform="translate(560, 55)">
      <rect width="165" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="8" y="8" width="149" height="24" rx="4" fill="#334155" />
      <text x="82" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">admin-web (React)</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Node 24 + npm cache</text>
      <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• tsc --noEmit (lint)</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Vitest component test</text>
      <text x="12" y="104" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Vite production build</text>
      <rect x="10" y="125" width="145" height="20" rx="4" fill="#065f46" />
      <text x="82" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#a7f3d0">Web Build Pass</text>
    </g>

    <!-- Job 5: Mobile -->
    <g transform="translate(735, 55)">
      <rect width="165" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <rect x="8" y="8" width="149" height="24" rx="4" fill="#334155" />
      <text x="82" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f1f5f9">mobile (React Native)</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Expo SDK 53 (Node 24)</text>
      <text x="12" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• TypeScript lint</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Jest UI component test</text>
      <text x="12" y="104" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Expo export bundle</text>
      <rect x="10" y="125" width="145" height="20" rx="4" fill="#065f46" />
      <text x="82" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#a7f3d0">Mobile Bundle OK</text>
    </g>
  </g>

  <!-- Arrow down to Gate -->
  <path d="M 500 410 L 500 435" stroke="#10b981" stroke-width="2.5" />
  <polygon points="500,440 495,430 505,430" fill="#10b981" />

  <!-- STAGE 3: CONSOLIDATED QUALITY GATE -->
  <g transform="translate(40, 445)" filter="url(#shadow3)">
    <rect width="920" height="70" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="180" height="40" rx="6" fill="#059669" />
    <text x="105" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">
      🛡️ 3. STATUS GATE
    </text>
    <text x="215" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">
      Job: `required` (Gom trạng thái của cả 5 job độc lập)
    </text>
    <text x="215" y="50" font-family="system-ui, sans-serif" font-size="11.5" fill="#d1fae5">
      Đánh giá Python script → Xuất Markdown Step Summary lên PR → Bắt buộc PASS mới được phép Merge vào main.
    </text>
  </g>

  <!-- Arrow down to CD -->
  <path d="M 500 515 L 500 540" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="500,545 495,535 505,535" fill="#f59e0b" />

  <!-- STAGE 4: CD & RELEASE DELIVERABLES -->
  <g transform="translate(40, 550)" filter="url(#shadow3)">
    <rect width="920" height="105" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="15" y="12" width="220" height="28" rx="6" fill="#b45309" />
    <text x="125" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff">
      4. CD &amp; DELIVERABLES (Release)
    </text>

    <!-- CD Deliverable 1 -->
    <rect x="250" y="12" width="320" height="80" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1" />
    <text x="265" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde68a">
      🐳 Backend &amp; Web: Docker Multi-Stage
    </text>
    <text x="265" y="52" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Đóng gói JRE 21 Alpine rút gọn (&lt;150MB)</text>
    <text x="265" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Non-root security user → Push lên GHCR</text>

    <!-- CD Deliverable 2 -->
    <rect x="590" y="12" width="315" height="80" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1" />
    <text x="605" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fde68a">
      📱 Mobile: Standalone Android APK
    </text>
    <text x="605" y="52" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Tự động hóa build native APK</text>
    <text x="605" y="68" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Đính kèm trực tiếp vào GitHub Releases</text>
  </g>
</svg>
