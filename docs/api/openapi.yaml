components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server session; unsafe requests also require X-CSRF-TOKEN. Login/CSRF bootstrap is deferred to
        the identity slice and native-client scope check.
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: CSRF token bound to current session; obtain through the future identity bootstrap.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Scoped to actor and operation. Same key/payload returns the original resource ID with its current
        representation; different payload returns 409. Commit receipt and domain mutation atomically. Sensitive
        challenge issuance uses expectedVersion instead.
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    '400':
      description: Invalid JSON, parameter or field validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    '401':
      description: Session authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    '403':
      description: Actor permission or CSRF denied
      content:
        application/problem+json:
