      operationId: acceptReservation
      tags:
      - Reservations
      summary: Seller atomically holds listing and all shared items
      description: Lock guards in documented order, recheck approved revision and item set, snapshot price/content/items,
        allocate ALL items and create unique trade in one transaction. Conflict rolls back everything. No general
        buyer hold quota; no expiry timestamp. Giveaway weekly receipt policy is pending A20; its check/count stage
        is not selected by this contract.
      x-implementation-status: planned
      x-policy-gates:
      - 'A20: giveaway weekly receipt limit parameters/check stage pending; no general buyer hold quota'
      parameters:
