openapi: 3.1.0
info:
  title: Dorm Trading Platform - shared implementation contracts
  version: 0.1.0
  description: Requirements v1.1. System status, health, report/media operations, listing-review decisions, and notification
    inbox/read operations are implemented. Other business operations remain planned. x-policy-gates list OPEN decisions;
    see docs/api/README.md before implementation.
