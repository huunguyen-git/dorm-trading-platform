      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
    get:
      operationId: listListings
      tags:
      - Listings
      summary: Browse approved published revisions
      description: Authenticated initial contract; guest access not approved. Stable order createdAt DESC, id DESC.
        Availability HELD if any item is held, SOLD if any item is sold (SOLD wins). No private seller details.
        Optional q matches title/description, categoryId is exact category, maxPriceVnd is inclusive, and courseCode
        is exact stored text without cross-school equivalence (A15). Radius/coordinates are deferred.
        S11/C38 confirms temporarily unavailable listings still count toward quota while public; listings unavailable
        because an item was sold are archived without inventing a completed trade for the related listing.
      x-implementation-status: planned
      x-policy-gates:
      - 'A11: geographic search is deferred'
      - 'A14: lifecycle mapping and private historical revision display'
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: maxPriceVnd
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
      - name: courseCode
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
      responses:
        '200':
          description: Success (planned contract)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '429':
          $ref: '#/components/responses/429'
