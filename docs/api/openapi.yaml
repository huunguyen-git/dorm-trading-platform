      summary: Either participant cancels before handover report
      description: Only before evidence-backed handover. Record actor/reason, release allocations atomically and
        notify peer. Reopening requires separate publication/permission/quota checks. After handover return 409;
        mutual/admin cancellation is a deferred contract (A06). S11/C33 settles consent by the other party
