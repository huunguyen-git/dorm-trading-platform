      tags:
      - Trades
      summary: Buyer obtains or reissues completion challenge
      description: 'Only authenticated buyer after handover. S9/C26 limits per buyer + trade: at least 60 seconds
        between successful issues, at most 3 successful issues including initial issuance and 10 failed checks
        in the rolling 15 minutes (now-15m, now]. Reissue never resets the shared failure count; device/session
        changes do not reset it. At 3 issues deny issuance; at 10 failures deny issuance and checking. Blocked
        requests add no events. Events age out individually; no automatic issue when throttling ends.
        Six digits, 10 minutes, five failures per code, keyed verifier, one use. Invalidate at expiry or the fifth
        failed attempt; never auto-generate a replacement. Buyer may request a fresh code with a new 10-minute
        lifetime and zero failures; invalidate the old code and issue the new one atomically. Old code cannot revive.
        No trade lock/cancellation or change to handover deadline. Cache-Control: no-store. This operation increments trade version. Lost issuance
        response requires a fresh version and a rate-limited reissue; stale retries return 409. Plaintext codes
        are never stored in command receipts.'
