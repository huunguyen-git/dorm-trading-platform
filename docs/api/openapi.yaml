  /api/v1/listings/{listingId}/revisions:
    post:
      operationId: reviseListing
      tags:
      - Listings
      summary: Create a new draft revision; never overwrite agreed content
      description: Deny if this listing is held or completed. A different listing holding a shared item does not
        prohibit this edit. Do not edit inventory records or allocations through this endpoint.
        Draft creation differs from submission for review; S11/C38 requires temporary hiding at submission.
        Held/sold inventory records cannot be edited even through another listing.
      x-implementation-status: planned
      x-policy-gates:
      - 'A14: private historical revision display and rejected-edit lifecycle'
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
