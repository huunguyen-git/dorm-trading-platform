    post:
      operationId: submitListing
      tags:
      - Listings
      summary: Submit current draft for moderation
      description: Owner only. Validate one or more own physical items, 1-5 own listing photos, price and category.
        Submitted revision content becomes immutable; changes create a new revision.
        S11/C38 confirms temporarily hide the listing when submitting an edited revision; do not mutate accepted
        snapshots or release allocations. Publication of the edited content requires moderation and quota checks.
