spring.application.name=dorm-trading-platform
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dorm_trading}
spring.datasource.username=${DB_USERNAME:dorm_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
