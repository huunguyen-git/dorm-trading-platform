spring.application.name=dorm-trading-platform
server.port=${SERVER_PORT:8082}

# Security & CORS (P0-01 / P1-01)
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# PostgreSQL Database & Flyway Migrations (P0-03)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/dorm_trading}
spring.datasource.username=${POSTGRES_USER:dorm_user}
spring.datasource.password=${POSTGRES_PASSWORD:dorm_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Maildev SMTP
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}

# MinIO Object Storage (S3 API)
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.access-key=${S3_ACCESS_KEY:dorm_minio_admin}
storage.s3.secret-key=${S3_SECRET_KEY:dorm_minio_password123}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.buckets.student-cards=student-cards
storage.s3.buckets.item-images=item-images
storage.s3.buckets.handover-proofs=handover-proofs

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Never log auth DTOs or tokens, even when application debug is enabled.
logging.level.org.springframework.web=INFO
