spring.application.name=dorm-trading-platform
server.port=${SERVER_PORT:8082}

# Reverse proxy forwarded headers (Nginx edge proxy -> real client IP for rate limiting)
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

# Security & CORS (P0-01 / P1-01)
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# PostgreSQL Database & Flyway Migrations (P0-03)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/dorm_trading}
spring.datasource.username=${POSTGRES_USER:dorm_user}
spring.datasource.password=${POSTGRES_PASSWORD:dorm_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Maildev SMTP
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}

# Object storage: local (dev/test, không cần MinIO) hoặc s3 (MinIO/S3 API).
storage.backend=${STORAGE_BACKEND:local}
storage.local.dir=${STORAGE_LOCAL_DIR:.local/student-cards}
storage.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
storage.s3.access-key=${S3_ACCESS_KEY:dorm_minio_admin}
storage.s3.secret-key=${S3_SECRET_KEY:dorm_minio_password123}
storage.s3.region=${S3_REGION:us-east-1}
storage.s3.buckets.student-cards=student-cards
storage.s3.buckets.item-images=item-images
storage.s3.buckets.handover-proofs=handover-proofs

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Never log auth DTOs or tokens, even when application debug is enabled.
logging.level.org.springframework.web=INFO

# Catalog & Media Storage (P2-01 / P2-02)
app.catalog.moderation-mode=${CATALOG_MODERATION_MODE:AUTO_PRECHECK}
app.catalog.expiry-reconcile-enabled=${CATALOG_EXPIRY_RECONCILE_ENABLED:true}
app.catalog.expiry-reconcile-delay-ms=${CATALOG_EXPIRY_RECONCILE_DELAY_MS:60000}
app.catalog.expiry-reconcile-batch-size=${CATALOG_EXPIRY_RECONCILE_BATCH_SIZE:100}
app.media.storage-dir=${MEDIA_STORAGE_DIR:./data/uploads}
app.media.max-file-size-bytes=5242880
app.media.max-files-per-upload=5
app.media.max-files-per-user=${MEDIA_MAX_FILES_PER_USER:100}
app.media.max-bytes-per-user=${MEDIA_MAX_BYTES_PER_USER:104857600}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.orphan-cleanup-enabled=${MEDIA_ORPHAN_CLEANUP_ENABLED:true}
app.media.orphan-cleanup-delay-ms=${MEDIA_ORPHAN_CLEANUP_DELAY_MS:3600000}
app.media.orphan-min-age-minutes=${MEDIA_ORPHAN_MIN_AGE_MINUTES:60}
# Multipart uploads (P1-02 ảnh thẻ tối đa 5MB/file & P2-01 tối đa 5 ảnh x 5MB/lần)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=32MB
